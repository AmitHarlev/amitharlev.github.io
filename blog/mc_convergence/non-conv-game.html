<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markov Chain Challenge: No Limiting Distribution</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    svg, button, input[type=checkbox] { user-select: none; }
    .token { pointer-events: none; }
  </style>
</head>
<body class="bg-sky-200 h-screen flex">
  <div class="flex-1 flex">
    <!-- Builder + Canvas -->
    <div class="flex-1 flex flex-col">
      <!-- Header removed; using floating overlays instead -->

      <!-- Canvas with controls -->
      <div class="flex-1 overflow-hidden relative">
        <svg id="canvas" class="w-full h-full bg-sky-200">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="#374151"></polygon>
            </marker>
          </defs>
          <g id="edgesLayer"></g>
          <g id="statesLayer"></g>
          <g id="tokensLayer"></g>
          <g id="uiLayer"></g>
        </svg>

        <!-- Top-center goal + state counter -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 flex flex-nowrap items-center gap-3 bg-white/90 backdrop-blur-sm rounded-md shadow-md px-10 py-2">
          <span class="text-sm text-gray-600">Goal:</span>
          <span class="font-semibold text-gray-900 whitespace-nowrap">Markov chains with no unique limiting distributions</span>
          <span class="hidden md:inline text-gray-300">•</span>
          <span class="text-sm text-gray-600">States used</span>
          <span id="stateCounter" class="text-sm font-bold text-blue-900">0 / 5</span>
        </div>
        
        <!-- Edge info helper (floating) -->
        <div class="absolute left-4 top-24">
          <span id="edgeInfo" class="hidden text-gray-600 text-sm bg-white px-2 py-1 rounded shadow-sm"></span>
        </div>

        <!-- Properties panel (floating card, left side) -->
        <div id="propsPanel" class="absolute left-4 top-[120px] w-[340px] bg-white rounded-xl border border-gray-200 shadow-lg overflow-hidden">
          <div class="px-4 py-2 border-b border-gray-100 bg-gray-50">
            <div class="text-base font-semibold text-gray-900 text-center">Properties</div>
          </div>
          <div class="px-4 py-3 space-y-3">
            <label class="flex items-start gap-2.5 select-none cursor-pointer group">
              <input id="propNonUniqueChk" type="checkbox" class="mt-0.5 h-4 w-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500 focus:ring-1 focus:ring-offset-0" disabled>
              <span id="propNonUniqueText" class="text-sm font-medium text-gray-700 leading-snug group-hover:text-gray-900 transition-colors">Existance, no uniqueness: ?????</span>
            </label>
            <label class="flex items-start gap-2.5 select-none cursor-pointer group">
              <input id="propNonExistChk" type="checkbox" class="mt-0.5 h-4 w-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500 focus:ring-1 focus:ring-offset-0" disabled>
              <span id="propNonExistText" class="text-sm font-medium text-gray-700 leading-snug group-hover:text-gray-900 transition-colors">Non-existance: ?????</span>
            </label>
          </div>
        </div>

        <!-- Testing requirements panel (always visible, placed between properties and distribution) -->
        <div id="testInfoPanel" class="absolute left-4 top-[240px] w-[340px] bg-white rounded-xl border border-gray-200 shadow-lg overflow-hidden">
          <div class="px-4 py-2 border-b border-gray-100 bg-gray-50">
            <div class="text-base font-semibold text-gray-900 text-center">In order to test</div>
          </div>
          <div class="px-4 py-3 text-sm text-gray-700">
            Every state must have outgoing edges with weights summing to 1. Fractions won't work so please use decimals.
          </div>
        </div>

        <!-- Live distributions panel (shown during testing, left side below properties) -->
        <div id="distPanel" class="absolute left-4 top-[360px] w-[340px] bg-white rounded-xl border border-gray-200 shadow-lg overflow-hidden hidden">
          <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
            <div class="text-base font-semibold text-gray-900 text-center">Distribution by Initial State</div>
          </div>
          <div id="distPanelBody" class="p-3 text-xs"></div>
        </div>

        <!-- Hidden holders to preserve JS hooks -->
        <div class="hidden">
          <div id="resultText">No test run yet.</div>
          <div id="finalCongrats"></div>
        </div>

        <!-- Combined control panel -->
        <div class="absolute bottom-4 left-0 right-0 flex justify-center pointer-events-none">
          <div class="pointer-events-auto bg-white shadow-lg rounded-2xl px-4 py-3 flex items-center gap-4">
            <!-- Building tools -->
            <div class="flex items-center gap-2">
              <div class="flex rounded-lg overflow-hidden border border-gray-300">
                <button id="toolStateBtn" class="px-3 py-2 text-sm font-semibold bg-white text-blue-900 hover:bg-blue-50">Add States</button>
                <button id="toolEdgeBtn" class="px-3 py-2 text-sm font-semibold bg-white text-blue-900 hover:bg-blue-50">Add Edges</button>
                <button id="toolDeleteBtn" class="px-3 py-2 text-sm font-semibold bg-white text-rose-700 hover:bg-rose-50">Delete States/Edges</button>
              </div>
            </div>
            
            
            
            <!-- Test controls -->
            <div class="flex items-center gap-2">
              <button id="testBtn" class="px-4 py-2 bg-emerald-600 text-white font-semibold rounded-lg hover:bg-emerald-700">Test it</button>
              <button id="stopBtn" class="px-4 py-2 bg-red-500 text-white font-semibold rounded-lg hover:bg-red-600" style="display: none;">Stop</button>
              <!-- Speed segmented control (to the right of Test it / Stop) -->
              <div id="speedSegment" class="flex rounded-lg overflow-hidden border border-gray-300">
                <button id="speedSlow" class="px-3 py-2 text-sm font-semibold bg-emerald-600 text-white">Slow</button>
                <button id="speedFast" class="px-3 py-2 text-sm font-semibold bg-white text-gray-700 hover:bg-gray-50">Fast</button>
                <button id="speedFaster" class="px-3 py-2 text-sm font-semibold bg-white text-gray-700 hover:bg-gray-50">Faster</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="markov-chains.js"></script>
  <script>
    // Initialize engine in builder mode (no Markov mode)
    const svg = document.getElementById('canvas');
    const markov = new MarkovChains(svg, { viewerMode: false });

    // DOM refs
    const toolStateBtn = document.getElementById('toolStateBtn');
    const toolEdgeBtn = document.getElementById('toolEdgeBtn');
    const toolDeleteBtn = document.getElementById('toolDeleteBtn');
    const edgeInfo = document.getElementById('edgeInfo');
    const stateCounter = document.getElementById('stateCounter');

    const testBtn = document.getElementById('testBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn'); // optional: may not exist
    // Speed controls
    const speedSlow = document.getElementById('speedSlow');
    const speedFast = document.getElementById('speedFast');
    const speedFaster = document.getElementById('speedFaster');

    const resultText = document.getElementById('resultText');
    // Properties panel elements
    const propNonUniqueChk = document.getElementById('propNonUniqueChk');
    const propNonUniqueText = document.getElementById('propNonUniqueText');
    const propNonExistChk = document.getElementById('propNonExistChk');
    const propNonExistText = document.getElementById('propNonExistText');
    const finalCongrats = document.getElementById('finalCongrats');

    // Quest progress (session-only; no persistence across refresh)
    const STORAGE_KEYS = { reducible: 'mc_discovered_reducible', periodic: 'mc_discovered_periodic' };
    const DISCOVERED = { [STORAGE_KEYS.reducible]: false, [STORAGE_KEYS.periodic]: false };
    let congratsOverlay = null;
    let congratsShown = false;
    function getDiscovery(key){ return !!DISCOVERED[key]; }
    function setDiscovery(key){ DISCOVERED[key] = true; updateDiscoveryUI(); }
    function updateDiscoveryUI(){
      const r = getDiscovery(STORAGE_KEYS.reducible);
      const p = getDiscovery(STORAGE_KEYS.periodic);
      if (propNonUniqueChk) propNonUniqueChk.checked = !!r;
      if (propNonUniqueText) propNonUniqueText.textContent = `Existance, no uniqueness: ${r ? 'Multiple Recurrent Classes' : '?????'}`;
      if (propNonExistChk) propNonExistChk.checked = !!p;
      if (propNonExistText) propNonExistText.textContent = `No existance: ${p ? 'Periodic' : '?????'}`;
      if (finalCongrats) finalCongrats.classList.toggle('hidden', !(r && p));

      // Reposition the test info panel below the properties panel if visible
      try {
        const tip = document.getElementById('testInfoPanel');
        const props = document.getElementById('propsPanel');
        const svgEl = document.getElementById('canvas');
        if (tip && props && svgEl && !tip.classList.contains('hidden')){
          const propsRect = props.getBoundingClientRect();
          const containerRect = svgEl.getBoundingClientRect();
          const margin = 16;
          const topPx = Math.max(0, (propsRect.bottom - containerRect.top) + margin);
          tip.style.top = `${topPx}px`;
        }
      } catch (_) {}
    }
    updateDiscoveryUI();

    // Update state counter
    function updateStateCounter() {
      stateCounter.textContent = `${markov.states.length} / 5`;
    }

    // Smallest-unused label helper: returns "State n" where n is the smallest unused positive integer
    function nextStateLabel(){
      const used = new Set(markov.states.map(s => (s.label || '').trim()));
      let n = 1;
      while (used.has(`State ${n}`)) n += 1;
      return `State ${n}`;
    }

    // Limit addState to 5
    function addStateLimited(){
      if (markov.states.length >= 5) {
        alert('Limit: at most 5 states for this challenge.');
        return;
      }
      // Add a state and assign an unused color
      markov.addState();
      const newIdx = markov.states.length - 1;
      if (newIdx >= 0) {
        const s = markov.states[newIdx];
        markov.states[newIdx] = { ...s, color: pickUnusedStateColor(newIdx) };
        markov.render();
      }
      updateStateCounter();
    }

    // Tooling
    let activeTool = null; // null | 'state' | 'edge' | 'delete'
    function refreshToolButtons(){
      const stateActive = activeTool==='state';
      const edgeActive = activeTool==='edge';
      const deleteActive = activeTool==='delete';
      
      toolStateBtn.className = toolStateBtn.disabled ? 'px-3 py-2 text-sm font-semibold bg-gray-200 text-gray-400 cursor-not-allowed' :
        (stateActive ? 'px-3 py-2 text-sm font-semibold bg-blue-900 text-white' : 'px-3 py-2 text-sm font-semibold bg-white text-blue-900 hover:bg-blue-50');
      
      toolEdgeBtn.className = toolEdgeBtn.disabled ? 'px-3 py-2 text-sm font-semibold bg-gray-200 text-gray-400 cursor-not-allowed' :
        (edgeActive ? 'px-3 py-2 text-sm font-semibold bg-blue-900 text-white' : 'px-3 py-2 text-sm font-semibold bg-white text-blue-900 hover:bg-blue-50');
      
      toolDeleteBtn.className = toolDeleteBtn.disabled ? 'px-3 py-2 text-sm font-semibold bg-gray-200 text-gray-400 cursor-not-allowed' :
        (deleteActive ? 'px-3 py-2 text-sm font-semibold bg-red-600 text-white' : 'px-3 py-2 text-sm font-semibold bg-white text-rose-700 hover:bg-rose-50');
    }
    function setTool(tool){
      activeTool = tool;
      if (tool==='edge') { markov.beginEdgeMode(); } else { markov.cancelEdgeMode(); }
      refreshToolButtons();
      updateEdgeUI();
    }
    // Toggle behavior: clicking the active button unpresses it (goes to none)
    toolStateBtn.addEventListener('click', ()=>{ if (!toolStateBtn.disabled) { setTool(activeTool==='state' ? null : 'state'); updateTestButtonValidity(); } });
    toolEdgeBtn.addEventListener('click', ()=>{ if (!toolEdgeBtn.disabled) { setTool(activeTool==='edge' ? null : 'edge'); updateTestButtonValidity(); } });
    toolDeleteBtn.addEventListener('click', ()=>{ if (!toolDeleteBtn.disabled) { setTool(activeTool==='delete' ? null : 'delete'); updateTestButtonValidity(); } });

    // Edge ghost preview
    let mousePos = { x: 0, y: 0 };
    let previewLine = null;
    function ensurePreview(){
      if (!previewLine){
        previewLine = markov.svgEl('line', { x1:0,y1:0,x2:0,y2:0, stroke:'#1f2937', 'stroke-width':2, 'stroke-dasharray':'6 4' });
        previewLine.style.pointerEvents = 'none';
        document.getElementById('uiLayer').appendChild(previewLine);
      }
    }
    function removePreview(){ if (previewLine && previewLine.parentNode){ previewLine.parentNode.removeChild(previewLine); } previewLine=null; }
    function updateEdgeUI(){
      edgeInfo.classList.add('hidden'); // Always hide edge tooltips
      // preview
      if (markov.addingEdge && markov.selectedStates.length===1){
        const s = markov.states.find(s=>s.id===markov.selectedStates[0]);
        if (s){
          ensurePreview();
          previewLine.setAttribute('x1', s.x);
          previewLine.setAttribute('y1', s.y);
          previewLine.setAttribute('x2', mousePos.x);
          previewLine.setAttribute('y2', mousePos.y);
        }
      } else {
        removePreview();
      }
    }

    // Delete pills removed

    // Disable builder context menu behavior
    markov.handleStateContextMenu = (e, id) => { e.preventDefault(); e.stopPropagation(); };
    // Click behavior: delete when in delete mode; otherwise keep previous logic
    markov.onStateClick = (stateId, e) => {
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      if (activeTool === 'delete') {
        // Delete the clicked state
        markov.states = markov.states.filter(s=>s.id!==stateId);
        markov.edges = markov.edges.filter(ed=>ed.from!==stateId && ed.to!==stateId);
        updateStateCounter();
        markov.render();
        return;
      }
      if (markov.addingEdge || activeTool === 'edge') return; // edge flow continues
      if (activeTool === 'state') setTool(null);
      updateTestButtonValidity();
      markov.render();
    };
    markov.onRender = () => {
      // Keep edge tool active across renders
      if (activeTool === 'edge' && !markov.addingEdge) {
        markov.beginEdgeMode();
      }
      updateEdgeUI();
      updateTestButtonValidity();
      updateStateCounter();
    };

    // Click on canvas to place state
    svg.addEventListener('click', (e)=>{
      if (activeTool !== 'state') return;
      // avoid if clicking on an existing state node (let that be handled as state click)
      if (e.target.tagName === 'circle' && e.target.parentElement && e.target.parentElement.parentElement && e.target.parentElement.parentElement.id === 'statesLayer') return;
      if (markov.states.length >= 5){ alert('Limit: at most 5 states for this challenge.'); return; }
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const newIndex = markov.states.length; // index the new state will have
      const newState = {
        id: Date.now(), x: p.x, y: p.y, label: nextStateLabel(),
        color: pickUnusedStateColor(newIndex)
      };
      markov.states.push(newState);
      updateStateCounter();
      markov.render();
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape'){
        if (markov.addingEdge || activeTool === 'state' || activeTool === 'delete'){
          setTool(null);
          e.preventDefault();
          return;
        }
      }
      if (e.key.toLowerCase()==='e'){ setTool(activeTool==='edge' ? null : 'edge'); }
      if (e.key.toLowerCase()==='s'){ setTool(activeTool==='state' ? null : 'state'); }
      if (e.key.toLowerCase()==='v'){ setTool(null); }
    });

    // Cursor tracking for edge preview (SVG coordinates)
    svg.addEventListener('mousemove', (e)=>{
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      mousePos.x = p.x; mousePos.y = p.y;
      if (markov.addingEdge && markov.selectedStates.length===1 && previewLine){
        const s = markov.states.find(s=>s.id===markov.selectedStates[0]);
        if (s){
          previewLine.setAttribute('x1', s.x);
          previewLine.setAttribute('y1', s.y);
          previewLine.setAttribute('x2', mousePos.x);
          previewLine.setAttribute('y2', mousePos.y);
        }
      }
      updateTestButtonValidity();
    });
    // Auto layout removed

    // Removed export/load features

    // Speed management: fixed speeds selected by user
    let currentSpeedMode = 'slow'; // 'slow' | 'fast' | 'faster'
    function applySpeed(mode){
      // slow: 1000ms, fast: 500ms, faster: 100ms
      let delay = 1000;
      if (mode === 'fast') delay = 500;
      if (mode === 'faster' || mode === 'hyper') delay = 100; // support legacy name
      markov.setStepDelay(delay);
    }
    function updateSpeedUI(mode){
      const active = 'px-3 py-2 text-sm font-semibold bg-emerald-600 text-white';
      const inactive = 'px-3 py-2 text-sm font-semibold bg-white text-gray-700 hover:bg-gray-50';
      if (speedSlow) speedSlow.className = (mode==='slow') ? active : inactive;
      if (speedFast) speedFast.className = (mode==='fast') ? active : inactive;
      if (speedFaster) speedFaster.className = (mode==='faster') ? active : inactive;
    }
    function setSpeed(mode){
      currentSpeedMode = mode;
      applySpeed(mode);
      updateSpeedUI(mode);
    }
    // Default to slow when idle
    setSpeed('slow');
    if (speedSlow) speedSlow.addEventListener('click', ()=> setSpeed('slow'));
    if (speedFast) speedFast.addEventListener('click', ()=> setSpeed('fast'));
    if (speedFaster) speedFaster.addEventListener('click', ()=> setSpeed('faster'));

    // Basic rendering
    updateStateCounter();
    markov.render();
    

    // Enable dragging states and edge control points
    svg.addEventListener('mousemove', e => markov.handleMouseMove(e));
    svg.addEventListener('mouseup', (e) => {
      // First, finish any drag
      markov.handleMouseUp();
      // Also show delete prompt on release over a state (even after a drag)
      if (markov.addingEdge) return;
      if (activeTool && activeTool!=='delete') return;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      if (activeTool==='delete'){
        // Try deleting a state first
        const hitState = markov.states.find(s => Math.hypot(s.x - p.x, s.y - p.y) <= 42);
        if (hitState){
          markov.states = markov.states.filter(s=>s.id!==hitState.id);
          markov.edges = markov.edges.filter(ed=>ed.from!==hitState.id && ed.to!==hitState.id);
          updateStateCounter();
          markov.render();
          return;
        }
        // If no state, try hit-testing edges by distance to quadratic curve
        function distToQuadratic(p, e){
          const S = markov.states.find(s=>s.id===e.from);
          const T = markov.states.find(s=>s.id===e.to);
          if (!S || !T) return Infinity;
          let minD = Infinity;
          if (e.from === e.to){
            // Self-loop: approximate circular arc between two boundary points around S
            const ang = Math.atan2(e.controlY - S.y, e.controlX - S.x);
            const spread = 0.3;
            const nodeR = 40; // matches builder/viewer node radius base (pre-scaling used in game)
            const sx = S.x + Math.cos(ang - spread) * nodeR;
            const sy = S.y + Math.sin(ang - spread) * nodeR;
            const ex = S.x + Math.cos(ang + spread) * nodeR;
            const ey = S.y + Math.sin(ang + spread) * nodeR;
            const loopR = 25;
            const cx = S.x + Math.cos(ang) * (nodeR + loopR);
            const cy = S.y + Math.sin(ang) * (nodeR + loopR);
            // sample along arc
            const steps = 21;
            for (let i=0;i<=steps;i++){
              const t = i/steps;
              // interpolate angle long-way like in render (approx)
              const a0 = Math.atan2(sy - cy, sx - cx);
              const a1 = Math.atan2(ey - cy, ex - cx);
              let da = a1 - a0; if (Math.abs(da) < Math.PI) da += (da > 0 ? -2*Math.PI : 2*Math.PI);
              const a = a0 + da * t;
              const x = cx + loopR * Math.cos(a);
              const y = cy + loopR * Math.sin(a);
              const d = Math.hypot(x - p.x, y - p.y);
              if (d < minD) minD = d;
            }
          } else {
            // Regular quadratic curve sampling
            for (let t=0;t<=1.0;t+=0.05){
              const x = (1-t)*(1-t)*S.x + 2*(1-t)*t*e.controlX + t*t*T.x;
              const y = (1-t)*(1-t)*S.y + 2*(1-t)*t*e.controlY + t*t*T.y;
              const d = Math.hypot(x - p.x, y - p.y);
              if (d < minD) minD = d;
            }
          }
          return minD;
        }
        const HIT_THRESH = 10; // px, slightly larger to catch self-loop arc
        const hitEdge = markov.edges.find(e => distToQuadratic(p, e) <= HIT_THRESH);
        if (hitEdge){
          markov.edges = markov.edges.filter(ed=>ed.id!==hitEdge.id);
          markov.render();
          return;
        }
      }
    });
    svg.addEventListener('mouseleave', () => markov.handleMouseUp());
    svg.addEventListener('click', () => markov.handleCanvasClick());
    // Disable right-click menus on SVG
    svg.addEventListener('contextmenu', (e)=>{ e.preventDefault(); e.stopPropagation(); });

    // Exit Add States mode when beginning to drag a state (mousedown) to keep flow consistent
    const origHandleStateMouseDown = markov.handleStateMouseDown.bind(markov);
    markov.handleStateMouseDown = (e, id) => {
      if (activeTool === 'state') {
        setTool(null);
        pendingDeleteStateId = null;
        updateTestButtonValidity();
      }
      origHandleStateMouseDown(e, id);
    };

    // Utility: check if event target is within the states layer (circle or label)
    function isTargetWithinLayer(target, layerId){
      let node = target;
      while (node && node !== svg){
        if (node.id === layerId) return true;
        node = node.parentElement;
      }
      return false;
    }

    // Clicking empty canvas (not states or edges) exits modes
    svg.addEventListener('click', (e)=>{
      const isOnState = isTargetWithinLayer(e.target, 'statesLayer');
      const isOnEdge  = isTargetWithinLayer(e.target, 'edgesLayer');
      if (!isOnState && !isOnEdge){
        // Exit delete mode only on empty canvas
        if (activeTool === 'delete') {
          setTool(null);
        }
        // In Add Edges: clicking empty canvas cancels edge mode regardless of selection
        if (activeTool === 'edge') { setTool(null); }
        markov.render();
      }
    });

    // ---------- Analysis helpers ----------
    function updateTestButtonValidity(){
      const status = getValidationStatus();
      const disabled = !status.valid;
      testBtn.disabled = disabled;
      testBtn.title = disabled ? status.reason : '';
      if (disabled){
        testBtn.className = 'px-4 py-2 bg-gray-300 text-gray-600 font-semibold rounded-full cursor-not-allowed outline-none focus:outline-none focus:ring-0';
      } else {
        testBtn.className = 'px-4 py-2 bg-emerald-600 text-white font-semibold rounded-full hover:bg-emerald-700 outline-none focus:outline-none focus:ring-0';
      }
    }

    function getValidationStatus(){
      // No states
      if (!markov.states || markov.states.length === 0){
        return { valid: false, reason: 'Add at least one state to begin.' };
      }
      // Unique labels
      const labels = markov.states.map(s => (s.label || '').trim());
      const set = new Set(labels);
      if (set.size !== labels.length){
        return { valid: false, reason: 'Each state must have a unique name.' };
      }
      // Outgoing edges and probabilities
      for (const st of markov.states){
        const outs = markov.edges.filter(e => e.from === st.id);
        if (outs.length === 0){
          return { valid: false, reason: `State "${st.label}" has no outgoing edges.` };
        }
        let sum = 0;
        for (const e of outs){
          const w = parseFloat(e.weight);
          if (!isFinite(w)){
            return { valid: false, reason: `Edge weight from "${st.label}" must be a number.` };
          }
          sum += w;
        }
        if (Math.abs(sum - 1) > 1e-6){
          return { valid: false, reason: `Outgoing probabilities from "${st.label}" must sum to 1 (current: ${sum.toFixed(3)}).` };
        }
      }
      return { valid: true, reason: '' };
    }
    function buildIndexMaps(){
      const ids = markov.states.map(s=>s.id);
      const idToIdx = new Map(ids.map((id,i)=>[id,i]));
      return { ids, idToIdx };
    }

    function buildTransitionMatrix(){
      const { ids, idToIdx } = buildIndexMaps();
      const n = ids.length; const P = Array.from({length:n},()=>Array(n).fill(0));
      markov.states.forEach(s=>{
        const i = idToIdx.get(s.id);
        const outs = markov.edges.filter(e=>e.from===s.id);
        outs.forEach(e=>{ const j = idToIdx.get(e.to); P[i][j] += parseFloat(e.weight); });
      });
      return { ids, idToIdx, P };
    }

    function isStronglyConnected(n, adj){
      // adj: list of neighbors by indices
      const dfs = (start, G) => { const seen=Array(n).fill(false); const st=[start]; seen[start]=true; while(st.length){ const u=st.pop(); for(const v of G[u]) if(!seen[v]){ seen[v]=true; st.push(v);} } return seen.every(x=>x); };
      const all = Array.from({length:n},(_,i)=>i);
      const rev = Array.from({length:n},()=>[]);
      for(let u=0;u<n;u++){ for(const v of adj[u]) rev[v].push(u); }
      return dfs(0, adj) && dfs(0, rev);
    }

    function getSCCs(n, adj){
      // Kosaraju
      const rev = Array.from({length:n},()=>[]);
      for(let u=0;u<n;u++){ for(const v of adj[u]) rev[v].push(u); }
      const seen = Array(n).fill(false), order=[];
      function dfs1(u){ seen[u]=true; for(const v of adj[u]) if(!seen[v]) dfs1(v); order.push(u); }
      for(let i=0;i<n;i++) if(!seen[i]) dfs1(i);
      const comp = Array(n).fill(-1); let cid=0;
      function dfs2(u){ comp[u]=cid; for(const v of rev[u]) if(comp[v]===-1) dfs2(v); }
      for(let i=n-1;i>=0;i--){ const u=order[i]; if(comp[u]===-1){ dfs2(u); cid++; } }
      const groups = Array.from({length:cid},()=>[]);
      for(let i=0;i<n;i++) groups[comp[i]].push(i);
      return { comp, groups };
    }

    function isReducible(){
      const { idToIdx } = buildIndexMaps();
      const n = markov.states.length; if (n===0) return false;
      const adj = Array.from({length:n},()=>[]);
      const EPS = 1e-12;
      markov.edges.forEach(e=>{ 
        const w = parseFloat(e.weight);
        if (!(w > EPS)) return; // ignore zero-weight edges
        const u = idToIdx.get(e.from), v = idToIdx.get(e.to); 
        if (!adj[u].includes(v)) adj[u].push(v); 
      });
      return !isStronglyConnected(n, adj);
    }

    function computePeriodOfSCC(nodes, adj){
      // nodes: array of indices in SCC; adj: adjacency by indices
      const indexOf = new Map(nodes.map((v,i)=>[v,i]));
      // BFS from first node
      const start = nodes[0];
      const dist = Array(adj.length).fill(Infinity);
      const q=[start]; dist[start]=0;
      for(let qi=0; qi<q.length; qi++){
        const u=q[qi];
        for(const v of adj[u]) if (dist[v]===Infinity){ dist[v]=dist[u]+1; q.push(v);} 
      }
      let g = 0;
      for(const u of nodes){
        for(const v of adj[u]) if (indexOf.has(v) && dist[u]!==Infinity && dist[v]!==Infinity){
          const diff = dist[u] + 1 - dist[v];
          g = gcd(g, Math.abs(diff));
        }
      }
      return g<=0 ? 1 : g;
    }

    function gcd(a,b){ return b===0 ? a : gcd(b, a%b); }

    function lcm(a,b){ return a && b ? (a / gcd(a,b)) * b : (a || b); }

    function analyzeGraph(){
      const { idToIdx } = buildIndexMaps();
      const n = markov.states.length; if (n===0) return { period: 1, inSinkMask: [] };
      const adj = Array.from({length:n},()=>[]);
      const EPS = 1e-12;
      markov.edges.forEach(e=>{ 
        const w = parseFloat(e.weight);
        if (!(w > EPS)) return; // ignore zero-weight edges in periodicity/SCC graph
        const u=idToIdx.get(e.from), v=idToIdx.get(e.to); 
        if(!adj[u].includes(v)) adj[u].push(v); 
      });
      const { comp, groups } = getSCCs(n, adj);
      // A closed class (sink SCC) has no outgoing edge to outside
      const isSink = groups.map(() => true);
      for(let u=0;u<n;u++){
        for(const v of adj[u]) if (comp[u]!==comp[v]) isSink[comp[u]] = false;
      }
      let period = 1;
      const inSinkMask = Array(n).fill(false);
      let sinkCount = 0;
      for(let c=0;c<groups.length;c++){
        if (!isSink[c]) continue;
        const nodes = groups[c];
        const per = computePeriodOfSCC(nodes, adj);
        if (per > 1) period = lcm(period, per);
        nodes.forEach(i => inSinkMask[i] = true);
        sinkCount += 1;
      }
      return { period, inSinkMask, sinkCount };
    }

    // ---------- Simulation manager ----------
    const GROUP_COLORS = ['#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6']; // red, blue, green, orange, purple
    // Map token fill colors to a reasonable darker stroke for states
    const TOKEN_STROKES = {
      '#EF4444': '#B91C1C', // red-700
      '#3B82F6': '#1D4ED8', // blue-700
      '#10B981': '#047857', // emerald-700
      '#F59E0B': '#B45309', // amber-700
      '#8B5CF6': '#6D28D9'  // violet-700
    };
    function pickUnusedStateColor(indexFallback){
      const used = new Set((markov.states || []).map(s => (s.color && s.color.fill) ? s.color.fill : null).filter(Boolean));
      let fill = GROUP_COLORS.find(c => !used.has(c));
      if (!fill) {
        // Fallback to index-based if all used (should not happen with 5-state limit)
        fill = GROUP_COLORS[(indexFallback || 0) % GROUP_COLORS.length];
      }
      const stroke = TOKEN_STROKES[fill] || fill;
      return { name: 'Token', fill, stroke };
    }
    let sim = null;

    function startSimulation(){
      if (markov.states.length === 0){ alert('Add some states first.'); return; }
      if (!markov.validateMarkov()) return;

      stopSimulation();
      const { ids, idToIdx, P } = buildTransitionMatrix();
      const n = ids.length;
      const stateLabels = ids.map(id => {
        const s = markov.states.find(st => st.id === id);
        return s ? (s.label || 'State') : 'State';
      });

      const { period: periodicPeriod, inSinkMask, sinkCount } = analyzeGraph();
      // Game definition: reducible only if there are > 1 recurrent (closed) classes
      const reducible = sinkCount > 1;
      const periodic = periodicPeriod > 1;

      // Create tokens for each initial state group (reduced total count for clarity)
      const tokensPerGroup = 100
      const groups = []; // { color, tokens: [{stateId, elt}], dist, lastDist, lastDist2 }
      markov.tokensLayer.innerHTML = '';
      for(let gi=0; gi<n; gi++){
        const stateId = ids[gi];
        const st = markov.states.find(s => s.id === stateId);
        const color = (st && st.color && st.color.fill) ? st.color.fill : GROUP_COLORS[gi % GROUP_COLORS.length];
        const tokens = [];
        for(let k=0;k<tokensPerGroup;k++){
          const c = markov.svgEl('circle', { r: 3, fill: color, opacity: 0.9 });
          c.classList.add('token');
          markov.tokensLayer.appendChild(c);
          tokens.push({ stateId, elt: c });
        }
        markov.positionTokensAtState(tokens, stateId);
        groups.push({ color, tokens, dist: vectorOneHot(n, gi), lastDist: null, lastDist2: null });
      }

      // Panels: distribution (during testing) and test info (when idle)
      const distPanel = document.getElementById('distPanel');
      const distPanelBody = document.getElementById('distPanelBody');
      const propsPanel = document.getElementById('propsPanel');
      const testInfoPanel = document.getElementById('testInfoPanel');
      function positionDistPanelBelowProps(){
        if (!distPanel || !propsPanel) return;
        const propsRect = propsPanel.getBoundingClientRect();
        const containerRect = svg.getBoundingClientRect();
        const margin = 16; // px gap between panels
        const topPx = Math.max(0, (propsRect.bottom - containerRect.top) + margin);
        distPanel.style.top = `${topPx}px`;
      }
      function showDistPanel(){ distPanel.classList.remove('hidden'); }
      function hideDistPanel(){ distPanel.classList.add('hidden'); }
      function showTestInfoPanel(){
        if (testInfoPanel && propsPanel) {
          // Position directly under properties panel
          const propsRect = propsPanel.getBoundingClientRect();
          const containerRect = svg.getBoundingClientRect();
          const margin = 16;
          const topPx = Math.max(0, (propsRect.bottom - containerRect.top) + margin);
          testInfoPanel.style.top = `${topPx}px`;
          testInfoPanel.classList.remove('hidden');
        }
      }
      function hideTestInfoPanel(){ if (testInfoPanel) testInfoPanel.classList.add('hidden'); }
      function updateDistPanel(){
        if (!groups || groups.length === 0) { distPanelBody.innerHTML = ''; return; }
        const headerCells = ['<th class="p-1 text-left">Initial state</th>']
          .concat(stateLabels.map(lbl => `<th class=\"p-1 text-right text-gray-600\">${lbl}</th>`))
          .join('');
        let rows = '';
        groups.forEach((g, gi) => {
          const colorDot = `<span class=\"inline-block w-3 h-3 rounded-full mr-2\" style=\"background:${g.color}\"></span>`;
          const cells = [`<td class=\"p-1\">${colorDot}<span class=\"text-gray-800\">${stateLabels[gi]}</span></td>`]
            .concat(g.dist ? g.dist.map(p => `<td class=\"p-1 text-right\">${Math.round(p*100)}%</td>`) : stateLabels.map(()=>'<td class=\"p-1 text-right\">-</td>'))
            .join('');
          rows += `<tr class=\"border-t\">${cells}</tr>`;
        });
        distPanelBody.innerHTML = `<table class=\"w-full border-separate border-spacing-0\"><thead><tr>${headerCells}</tr></thead><tbody>${rows}</tbody></table>`;
      }

      // Ensure current speed setting is applied at start of test and increase visual spacing
      const previousSpacing = markov.TOKEN_SPACING;
      markov.TOKEN_SPACING = 3.0; // slightly more spaced during test
      applySpeed(currentSpeedMode);
      const maxSteps = 500;
      let t = 0; let stopped = false; let running = true;
      testBtn.style.display = 'none'; stopBtn.style.display = 'flex';
      // Disable tool buttons during test
      toolStateBtn.disabled = true;
      toolEdgeBtn.disabled = true;
      toolDeleteBtn.disabled = true;
      if (clearBtn) clearBtn.disabled = true;
      refreshToolButtons();
      // Replace the test info panel with the distribution panel while testing
      hideTestInfoPanel();
      showDistPanel();
      positionDistPanelBelowProps();

      function computeDists(){
        groups.forEach((g, gi)=>{
          // Distribution is now updated exactly in stepOnce(), just update history and metadata
          g.lastDist2 = g.lastDist;
          g.lastDist = [...g.dist]; // copy current as last
          // history for periodic check
          if (!g._hist) g._hist = [];
          // Keep enough history to compare t to t - d (periodicPeriod)
          g._hist.push([...g.dist]); // copy for history
          const cap = periodic ? (2*periodicPeriod + 2) : 4;
          while (g._hist.length > cap) g._hist.shift();
          // Track sink mass to ensure we've mostly entered closed classes
          g.sinkMass = g.dist.reduce((s, p, idx)=> s + ((inSinkMask[idx] ? 1 : 0) * p), 0);
        });
        updateDistPanel();
      }

      function l1(a,b){ let s=0; for(let i=0;i<a.length;i++) s+=Math.abs(a[i]-b[i]); return s; }
      function maxPairwiseL1(arr){ let m=0; for(let i=0;i<arr.length;i++){ for(let j=i+1;j<arr.length;j++){ m = Math.max(m, l1(arr[i], arr[j])); } } return m; }
      function avgVec(arr){ const n=arr[0].length; const out=Array(n).fill(0); for(const v of arr) for(let i=0;i<n;i++) out[i]+=v[i]; for(let i=0;i<n;i++) out[i]/=arr.length; return out; }

      let stationaryStepsCount = 0; // Track how many steps we've been stationary
      let periodicCyclesCompleted = 0; // Track how many periods have been completed
      let reducibleStableSteps = 0; // Track how many steps reducible chain has been stable
      
      function shouldStop(){
        // Stop if stationary-ish: across-group distances small and per-group change small
        const dists = groups.map(g=>g.dist);
        if (dists.every(d=>d)){
          const across = maxPairwiseL1(dists);
          const change = Math.max(...groups.map(g => (g.lastDist ? l1(g.dist, g.lastDist) : 1)));
          if (across < 0.01 && change < 0.005) {
            stationaryStepsCount++;
            if (stationaryStepsCount >= 3) return { type: 'stationary' };
          } else {
            stationaryStepsCount = 0; // Reset if not stationary
          }
        }
        // If periodic property detected: stop when stabilized modulo period for 3 full cycles
        if (periodic){
          // Require most mass to be in sink classes to avoid transient noise
          const ready = groups.every(g => (g.sinkMass || 0) > 0.98);
          const perOK = ready && groups.every(g => {
            if (!g._hist || g._hist.length < (periodicPeriod + 1)) return false;
            const curr = g._hist[g._hist.length - 1];
            const lag1 = g._hist[g._hist.length - 1 - periodicPeriod];
            const close1 = l1(curr, lag1) < 0.10;
            if (close1) return true;
            if (g._hist.length >= (2*periodicPeriod + 1)){
              const lag2 = g._hist[g._hist.length - 1 - 2*periodicPeriod];
              return l1(curr, lag2) < 0.10;
            }
            return false;
          });
          if (perOK) {
            periodicCyclesCompleted++;
            if (periodicCyclesCompleted >= 3 * periodicPeriod) {
              return { type: 'periodic' };
            }
          }
        }
        // If reducible and not periodic: stop when each group stabilized but differ for 4 steps
        if (reducible && !periodic){
          const stable = groups.every(g => g.lastDist && l1(g.dist, g.lastDist) < 0.02);
          const across = maxPairwiseL1(groups.map(g=>g.dist));
          if (stable && across >= 0.10) {
            reducibleStableSteps++;
            if (reducibleStableSteps >= 4) {
              return { type: 'reducible-different' };
            }
          } else {
            reducibleStableSteps = 0; // Reset if not stable
          }
        }
        if (t >= maxSteps) return { type: periodic ? 'periodic' : 'timeout' };
        return null;
      }

      // Discovery modal queue
      const discoverOverlay = createDiscoveryOverlay();
      const infoOverlay = createInfoOverlay();
      let discoveryQueue = [];
      function showNextDiscovery(){
        if (discoveryQueue.length === 0) {
          // All discovery modals have been viewed; optionally show congrats now
          const r = getDiscovery(STORAGE_KEYS.reducible);
          const p = getDiscovery(STORAGE_KEYS.periodic);
          if (r && p && !congratsShown){
            if (!congratsOverlay) congratsOverlay = createCongratsOverlay();
            try { congratsOverlay.show(); congratsShown = true; } catch (_) {}
          }
          discoverOverlay.hide();
          return;
        }
        const { name, definition } = discoveryQueue.shift();
        // Pass showNextDiscovery as the onClose so the check runs after Continue
        discoverOverlay.show(name, definition, showNextDiscovery);
      }
      function enqueueDiscovery(name, definition){
        discoveryQueue.push({ name, definition });
        if (discoverOverlay.isHidden()) showNextDiscovery();
      }

      function describeOutcome(finalType){
        // Classify success & teach
        const hadR = getDiscovery(STORAGE_KEYS.reducible);
        const hadP = getDiscovery(STORAGE_KEYS.periodic);
        
        // If both reducible and periodic, don't set discoveries or show modals
        if (reducible && periodic){
          infoOverlay.show('Success...but', 'For some starting states, the limiting distribution exists. For others, it does not. Try to simplify this chain so that either: (1) all starting states have a limiting distribution, but they\'re different depending on where you start, or (2) no starting states have a limiting distribution. This will help you understand what specific properties cause each of these cases.');
          return;
        }
        
        if (reducible) {
          setDiscovery(STORAGE_KEYS.reducible);
          if (!hadR) enqueueDiscovery('Multiple Recurrent Classes', 'Limiting distributions exist but are not unique (they depend on the starting state). There are multiple subsets of the state space that "trap" the Markov chain so that it can never leave. These are called recurrent classes. This means the starting state can determine which recurrent class the chain gets trapped in, causing the limiting distribution to depend on where you start.');
        }
        if (periodic) {
          setDiscovery(STORAGE_KEYS.periodic);
          if (!hadP) enqueueDiscovery('Periodic', 'The limiting distribution does not exist because the Markov chain cycles between different distributions and never converges to a single, stable distribution.');
        }
        if (reducible){
          if (hadR) {
            infoOverlay.show('Multiple Recurrent Classes (already discovered)', 'Your chain once again has limiting distributions that exist but are not unique. Try to build a chain with no limiting distributions.');
          }
        //   resultText.innerHTML = `Nice! Your chain has <b>multiple recurrent classes</b>: the state space splits into separate regions, so different starting colors end up with different long-run behavior.`;
          return;
        }
        if (periodic){
          if (hadP) {
            infoOverlay.show('Periodic (already discovered)', 'Your chain once again has no limiting distributions. Try to build a chain where limiting distributions exist, but depend on the starting state.');
          }
        //   resultText.innerHTML = `Nice! Your chain is <b>periodic</b>: the system cycles through parts with period > 1, so the distributions keep oscillating with color-dependent patterns.`;
          return;
        }
        // No issues -> limiting distribution exists
        resultText.textContent = 'This chain appears to have a limiting distribution: all colors converged to the same distribution.';
        infoOverlay.show('A unique limiting distribution exists', 'This chain converges to the same limiting distribution regardless of the starting state. Think about why and then give it another shot!');
      }

      function stepOnce(){
        // Update distributions mathematically (exact float calculations)
        groups.forEach(g => {
          // Compute new distribution exactly using matrix multiplication
          const newDist = Array(n).fill(0);
          g.dist.forEach((prob, fromIdx) => {
            const fromStateId = ids[fromIdx];
            const outs = markov.edges.filter(e => e.from === fromStateId);
            outs.forEach(edge => {
              const toIdx = idToIdx.get(edge.to);
              const weight = parseFloat(edge.weight);
              newDist[toIdx] += prob * weight;
            });
          });
          g.dist = newDist;
        });

        // Visual token movement (rounded to integers for display)
        const moveGroups = new Map();
        function addMove(edge, token){ if(!edge) return; const key = `${edge.from}_${edge.to}_${edge.id}`; if(!moveGroups.has(key)) moveGroups.set(key,{ edge, tokens: []}); moveGroups.get(key).tokens.push(token); }

        groups.forEach(g => {
          // Group this color's tokens by current state
          const byState = new Map();
          g.tokens.forEach(tok => {
            if (!byState.has(tok.stateId)) byState.set(tok.stateId, []);
            byState.get(tok.stateId).push(tok);
          });

          // For each origin state, split its tokens across outgoing edges by weights (rounded for visual)
          byState.forEach((tokenList, stateId) => {
            const outs = markov.edges.filter(e => e.from === stateId);
            if (outs.length === 0) return; // no movement
            let assigned = 0;
            outs.forEach((edge, idx) => {
              const prob = parseFloat(edge.weight);
              const count = (idx === outs.length - 1)
                ? tokenList.length - assigned
                : Math.round(tokenList.length * prob); // Use round instead of floor for better approximation
              for (let i = 0; i < count && assigned < tokenList.length; i++) {
                addMove(edge, tokenList[assigned++]);
              }
            });
          });
        });

        // Animate
        const promises = [];
        moveGroups.forEach(group => {
          promises.push(new Promise(resolve => {
            markov.animateTokenClusterAlongEdge(group.tokens, group.edge, markov.stepDelay, resolve);
          }));
        });
        Promise.all(promises).then(()=>{
          computeDists();
          t += 1;
          // No automatic speed ramping; speed is controlled by user selection
          const stopReason = shouldStop();
          if (stopReason){
            running = false; stopped = true; testBtn.style.display = 'flex'; stopBtn.style.display = 'none';
            // Re-enable tool buttons after test
            toolStateBtn.disabled = false;
            toolEdgeBtn.disabled = false;
            toolDeleteBtn.disabled = false;
            if (clearBtn) clearBtn.disabled = false;
            refreshToolButtons();
            hideDistPanel();
            showTestInfoPanel();
            // Restore token spacing after test ends
            markov.TOKEN_SPACING = previousSpacing;
            describeOutcome(stopReason.type);
          } else if (running) {
            setTimeout(stepOnce, 50); // chain steps back-to-back paced by animation
          }
        });
      }

      // Initial dists and go
      computeDists();
      resultText.textContent = 'Running test... (colors indicate starting state)';
      stepOnce();

      sim = { stop: ()=>{ running=false; testBtn.style.display = 'flex'; stopBtn.style.display = 'none'; toolStateBtn.disabled = false; toolEdgeBtn.disabled = false; toolDeleteBtn.disabled = false; if (clearBtn) clearBtn.disabled = false; refreshToolButtons(); resultText.textContent = 'Stopped.'; hideDistPanel(); showTestInfoPanel(); clearTokens(); markov.TOKEN_SPACING = previousSpacing; } };
    }

    function stopSimulation(){ if (sim){ sim.stop(); sim=null; } }

    testBtn.addEventListener('click', (e)=>{ if (testBtn.disabled) return; setTool(null); startSimulation(); });
    stopBtn.addEventListener('click', stopSimulation);

    // Small helpers
    function vectorOneHot(n, i){ const v = Array(n).fill(0); v[i]=1; return v; }

    // ----- Discovery modal factory -----
    function createDiscoveryOverlay(){
      // Build overlay elements once
      const overlay = document.createElement('div');
      overlay.id = 'discoveryOverlay';
      overlay.className = 'fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-40';
      const box = document.createElement('div');
        box.className = 'bg-white w-[90%] max-w-3xl rounded-lg shadow-xl p-6';
      const title = document.createElement('div');
      title.id = 'discoveryTitle';
        title.className = 'text-2xl font-bold text-gray-900 text-center';
      const body = document.createElement('div');
      body.id = 'discoveryBody';
      body.className = 'text-gray-700 mt-2';
      const ok = document.createElement('button');
        ok.className = 'mt-4 px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 block mx-auto';
      ok.textContent = 'Continue';
      box.appendChild(title); box.appendChild(body); box.appendChild(ok);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      let onClose = null;
      ok.addEventListener('click', ()=>{ overlay.classList.add('hidden'); if (onClose) onClose(); });
      return {
        show: (name, def, next)=>{ try{ clearTokens(); }catch(_){} title.textContent = `🎉 Discovered: ${name}`; body.textContent = def; onClose = next; overlay.classList.remove('hidden'); overlay.classList.add('flex'); },
        hide: ()=>{ overlay.classList.add('hidden'); overlay.classList.remove('flex'); },
        isHidden: ()=> overlay.classList.contains('hidden')
      };
    }

    // ----- Info modal (generic) -----
    function createInfoOverlay(){
      const overlay = document.createElement('div');
      overlay.id = 'infoOverlay';
      overlay.className = 'fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50';
      const box = document.createElement('div');
      box.className = 'bg-white w-[90%] max-w-3xl rounded-lg shadow-xl p-6';
      const title = document.createElement('div');
      title.className = 'text-2xl font-bold text-gray-900 text-center';
      const body = document.createElement('div');
      body.className = 'text-gray-700 mt-2';
      const ok = document.createElement('button');
      ok.className = 'mt-4 px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 block mx-auto';
      ok.textContent = 'Try again';
      box.appendChild(title); box.appendChild(body); box.appendChild(ok);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      ok.addEventListener('click', ()=>{ overlay.classList.add('hidden'); });
      return {
        show: (t, msg)=>{ try{ clearTokens(); }catch(_){} title.textContent = t; body.textContent = msg; overlay.classList.remove('hidden'); overlay.classList.add('flex'); },
        hide: ()=>{ overlay.classList.add('hidden'); overlay.classList.remove('flex'); }
      };
    }

    // ----- Congrats modal (when both properties discovered) -----
    function createCongratsOverlay(){
      const overlay = document.createElement('div');
      overlay.id = 'congratsOverlay';
      overlay.className = 'fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50';
      const box = document.createElement('div');
      box.className = 'bg-white w-[90%] max-w-2xl rounded-lg shadow-xl p-6';
      const title = document.createElement('div');
      title.className = 'text-2xl font-bold text-gray-900 text-center';
      title.textContent = '🎉 Congratulations! 🎉';
      const body = document.createElement('div');
      body.className = 'text-gray-700 mt-2 text-center';
      body.textContent = 'You discovered both properties that can stop a finite Markov chain from converging to a unique limiting distribution. Close this tab when you are ready to return to the blog post.';
      const ok = document.createElement('button');
      ok.className = 'mt-4 px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 block mx-auto';
      ok.textContent = 'Continue';
      box.appendChild(title); box.appendChild(body); box.appendChild(ok);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      function hide(){ overlay.classList.add('hidden'); overlay.classList.remove('flex'); }
      ok.addEventListener('click', hide);
      return {
        show: ()=>{ try{ clearTokens(); }catch(_){} overlay.classList.remove('hidden'); overlay.classList.add('flex'); },
        hide
      };
    }

    // Clear tokens helper
    function clearTokens(){
      if (markov && markov.tokensLayer) {
        markov.tokensLayer.innerHTML = '';
      }
    }

    // Reposition panels on window resize
    window.addEventListener('resize', positionDistPanelBelowProps);
    window.addEventListener('resize', ()=>{
      try{
        const tip = document.getElementById('testInfoPanel');
        const props = document.getElementById('propsPanel');
        if (tip && props && !tip.classList.contains('hidden')){
          const propsRect = props.getBoundingClientRect();
          const containerRect = svg.getBoundingClientRect();
          const margin = 16;
          const topPx = Math.max(0, (propsRect.bottom - containerRect.top) + margin);
          tip.style.top = `${topPx}px`;
        }
      }catch(_){}
    });

    // Position properties panel and distribution panel
    function positionPanels() {
      const propsPanel = document.getElementById('propsPanel');
      const distPanel = document.getElementById('distPanel');
      const propsPanelHeight = propsPanel.offsetHeight;
      const distPanelHeight = distPanel.offsetHeight;

      // Position properties panel
      const propsPanelTop = 120; // Initial top position
      propsPanel.style.top = `${propsPanelTop}px`;

      // Position distribution panel below properties panel
      const distPanelTop = propsPanelTop + propsPanelHeight + 20; // 20px margin
      distPanel.style.top = `${distPanelTop}px`;
    }

    // Call positionPanels on window resize
    window.addEventListener('resize', positionPanels);
    // Initial call to set correct positions
    positionPanels();
    // Also position test info panel initially
    (function(){
      try{
        const tip = document.getElementById('testInfoPanel');
        const props = document.getElementById('propsPanel');
        if (tip && props && !tip.classList.contains('hidden')){
          const propsRect = props.getBoundingClientRect();
          const containerRect = svg.getBoundingClientRect();
          const margin = 16;
          const topPx = Math.max(0, (propsRect.bottom - containerRect.top) + margin);
          tip.style.top = `${topPx}px`;
        }
      }catch(_){}
    })();
  </script>
</body>
</html>
