<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ENGR 1101 Office Hours Code</title>
    <style>
      :root {
        color: #202124;
        background: #f6f7f9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 640px);
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: white;
        padding: 28px;
        box-shadow: 0 18px 50px rgb(27 39 51 / 0.08);
      }
      h1 {
        margin: 0 0 22px;
        font-size: 2rem;
        line-height: 1.1;
        white-space: nowrap;
      }
      p {
        margin: 0 0 22px;
        color: #5f6368;
        line-height: 1.45;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 7px;
        font-weight: 650;
      }
      input,
      button {
        min-height: 44px;
        border-radius: 6px;
        font: inherit;
      }
      input {
        border: 1px solid #c9d0dc;
        padding: 10px 12px;
      }
      input:focus {
        outline: 3px solid #d7e2ff;
        border-color: #174ea6;
      }
      #code {
        text-transform: uppercase;
      }
      button {
        border: 0;
        background: #174ea6;
        color: white;
        cursor: pointer;
        font-weight: 750;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }
      #message {
        display: none;
        margin-top: 18px;
        border-radius: 8px;
        border: 1px solid;
        padding: 13px 14px;
        line-height: 1.4;
      }
      .success {
        color: #137333;
        border-color: #b7dfc0;
        background: #ecf7ee;
      }
      .warning {
        color: #8a4b00;
        border-color: #f4d37d;
        background: #fff8e1;
      }
      .error {
        color: #a50e0e;
        border-color: #f1b8b2;
        background: #fcebea;
      }
      .help-box {
        margin-top: 18px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #f8fafc;
        padding: 13px 14px;
        color: #3c4043;
        line-height: 1.4;
      }
      @media (max-width: 560px) {
        h1 {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ENGR 1101 - Office Hours Code</h1>
      <form id="form">
        <label>
          Cornell NetID
          <input id="netid" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="abc123" />
        </label>
        <label>
          Office hours code
          <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code" />
        </label>
        <button id="submit" type="submit">Submit code</button>
      </form>
      <div id="message"></div>
      <div class="help-box">Need help? Send a message to the instructors on Ed and we'll help you out.</div>
    </main>

    <script type="module">
      import { init, id } from "https://esm.sh/@instantdb/core@1.0.49";

      const APP_ID = "23ef9475-df9f-420a-ad86-daad2f7a704d";
      const db = init({ appId: APP_ID });

      const form = document.querySelector("#form");
      const button = document.querySelector("#submit");
      const netidInput = document.querySelector("#netid");
      const codeInput = document.querySelector("#code");
      const message = document.querySelector("#message");

      codeInput.addEventListener("input", () => {
        codeInput.value = codeInput.value.toUpperCase();
      });

      function normalizeNetid(value) {
        return value.trim().toLowerCase().replace(/@cornell\.edu$/i, "");
      }

      function normalizeCode(value) {
        return value.trim().toUpperCase().replace(/\s+/g, "");
      }

      function pairKey(netid, code) {
        return `${netid}::${code}`;
      }

      function show(kind, body) {
        message.className = kind;
        message.textContent = body;
        message.style.display = "block";
      }

      async function logSubmission(submission) {
        try {
          await db.transact(db.tx.ohCodeSubmissions[id()].create(submission));
        } catch (_) {
          // A repeated identical NetID/code submission hits the unique submissionPairKey.
          // We intentionally ignore it.
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const netid = normalizeNetid(netidInput.value);
        const code = normalizeCode(codeInput.value);

        if (!/^[a-z]{2,}[0-9]*$/.test(netid)) {
          show("error", "Use your Cornell NetID, without @cornell.edu.");
          return;
        }
        if (code.length < 3) {
          show("error", "Enter the code from your office hours index card.");
          return;
        }

        button.disabled = true;
        button.textContent = "Submitting...";

        const key = pairKey(netid, code);
        const now = Date.now();
        const submissionPairKey = pairKey(netid, code);

        try {
          const { data } = await db.queryOnce(
            {
              ohCodeAssignments: { $: { where: { pairKey: key } } },
              ohCodeNetids: { $: { where: { netid } } },
              ohCodeClaims: { $: { where: { assignmentPairKey: key } } },
            },
            { ruleParams: { pairKey: key, netid } },
          );

          const assignment = data.ohCodeAssignments[0];
          const knownNetid = data.ohCodeNetids[0];
          const existingClaim = data.ohCodeClaims[0];

          if (!assignment) {
            if (knownNetid) {
              await logSubmission({
                netid,
                normalizedCode: code,
                displayCode: code,
                status: "wrong_code",
                submittedAt: now,
                submissionPairKey,
                assignmentPairKey: key,
                note: "Known NetID submitted a code that was not assigned to them.",
              });
            }
            show(
              "warning",
              knownNetid
                ? "This isn't the code we have assigned to you. Please double check for typos."
                : "That netID isn't in our list. Please double check for typos.",
            );
            return;
          }

          if (existingClaim) {
            show("success", "All set! Thanks for visiting office hours.");
            return;
          }

          const submissionId = id();
          await db.transact([
            db.tx.ohCodeSubmissions[submissionId].create({
              netid,
              normalizedCode: code,
              displayCode: code,
              status: "unique_code",
              submittedAt: now,
              submissionPairKey,
              assignmentPairKey: assignment.pairKey,
            }),
            db.tx.ohCodeClaims[id()].create({
              normalizedCode: code,
              assignmentPairKey: assignment.pairKey,
              displayCode: code,
              netid,
              claimedAt: now,
              submissionId,
            }),
          ]);

          codeInput.value = "";
          show("success", "All set! Thanks for visiting office hours.");
        } catch (_) {
          await logSubmission({
            netid,
            normalizedCode: code,
            displayCode: code,
            status: "used_code",
            submittedAt: Date.now(),
            submissionPairKey,
            assignmentPairKey: key,
            note: "Claim failed, likely because the code was already claimed.",
          });
          show(
            "warning",
            "This isn't the code we have assigned to you. Please double check for typos.",
          );
        } finally {
          button.disabled = false;
          button.textContent = "Submit code";
        }
      });
    </script>
  </body>
</html>
